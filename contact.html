<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak — Dwi Prasetyo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="ambient-canvas" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <header class="navbar-wrapper">
    <nav class="navbar-pill" aria-label="Navigasi Utama">
      <a href="index.html" class="brand-link">
        <span class="brand-dot"></span>
        <span data-brand-name>Dwi Prasetyo</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="">Beranda</a></li>
        <li><a href="about.html" class="">Biodata & Pendidikan</a></li>
        <li><a href="projects.html" class="">Karya</a></li>
        <li><a href="contact.html" class="active">Kontak</a></li>
      </ul>

      <div class="nav-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Ganti Tema Terang/Gelap" title="Ganti Tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17" x2="20" y2="17"></line>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="section-block">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        <span>Hubungi Saya</span>
      </div>
      <h1 class="hero-title" style="margin-bottom: 0.75rem;">Mari Berdiskusi</h1>
      <p class="hero-subtitle">Tertarik berkolaborasi, mendiskusikan proyek web, atau sekadar menyapa? Silakan kirim pesan.</p>
    </section>

    <div class="form-grid">
      <form id="staticContactForm" class="form-card liquid-glass">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="nama@domain.com" required>
        </div>
        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" name="message" class="form-control" placeholder="Ceritakan kebutuhan atau ide Anda..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Kirim Pesan</button>
        <div class="notice-box" id="contactNotice" role="status"></div>
      </form>

      <aside class="form-card liquid-glass">
        <h2 class="section-title" style="font-size: 1.45rem; margin-bottom: 1rem;">Kontak Langsung</h2>
        <div id="contactDirect" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div id="footerInfo"><strong>Dwi Prasetyo</strong></div>
      <div class="footer-links" id="footerSocials"></div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
